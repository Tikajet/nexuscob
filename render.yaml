services:
  # 1. BACK-END (API Node.js)
  - type: web
    name: nexuscob-api
    env: node
    region: oregon
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && node index.js
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nexuscob-db
          property: connectionString

  # 2. FRONT-END (React + Vite)
  - type: web
    name: nexuscob-web
    env: static
    region: oregon
    plan: free
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # 3. BANCO DE DADOS (PostgreSQL)
  - name: nexuscob-db
    databaseName: nexuscob
    user: nexuscob_user
    plan: free
    region: oregon
